<mat-form-field>
  <mat-label>Chart Type</mat-label>
  <mat-select [value]="selectedType()" (selectionChange)="onTypeChange($event.value)">
    @for (type of chartTypes; track type) {
      <mat-option [value]="type">{{ type }}</mat-option>
    }
  </mat-select>
</mat-form-field>
<mat-form-field>
  <mat-label>Search by name</mat-label>
  <input
    matInput
    [value]="searchTerm()"
    (input)="searchTerm.set($any($event.target).value)"
    placeholder="Type to filter…"
  />
</mat-form-field>

<table mat-table [dataSource]="filteredCharts()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let chart">{{ chart.name }}</td>
  </ng-container>

  <ng-container matColumnDef="film_type">
    <th mat-header-cell *matHeaderCellDef>Film Type</th>
    <td mat-cell *matCellDef="let chart">{{ chart.film_type }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let chart">
      <a [routerLink]="['/charts', selectedType(), chart.id]">View</a>

      @if (authService.hasMinimumRole(UserRole.EDITOR)) {
        <button mat-button (click)="downloadChart(chart)">Download CSV</button>
        <button mat-button (click)="editChart(chart)">Edit</button>
        <button mat-button color="warn" [disabled]="deletingId() === chart.id" (click)="deleteChart(chart)">
          {{ deletingId() === chart.id ? 'Deleting…' : 'Delete' }}
        </button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
