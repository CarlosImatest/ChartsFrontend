<mat-form-field>
  <mat-label>Chart Type</mat-label>
  <mat-select [value]="selectedType()" (selectionChange)="onTypeChange($event.value)">
    @for (type of chartTypes; track type) {
      <mat-option [value]="type">{{ type }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<table mat-table [dataSource]="charts()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let chart">{{ chart.name }}</td>
  </ng-container>

  <ng-container matColumnDef="film_type">
    <th mat-header-cell *matHeaderCellDef>Film Type</th>
    <td mat-cell *matCellDef="let chart">{{ chart.film_type }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let chart">
      <a [routerLink]="['/charts', selectedType(), chart.id]">View</a>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
