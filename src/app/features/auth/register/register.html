<div class="register-container">
  <h2>Add user</h2>

  <form (ngSubmit)="onSubmit()">
    <mat-form-field>
      <mat-label>First name</mat-label>
      <input matInput [(ngModel)]="firstName" name="firstName" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Last name</mat-label>
      <input matInput [(ngModel)]="lastName" name="lastName" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="email" name="email" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Temporary password</mat-label>
      <input matInput type="password" [(ngModel)]="password" name="password" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Role</mat-label>
      <mat-select [(ngModel)]="role" name="role">
        @for (r of roles; track r) {
          <mat-option [value]="r">{{ r }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    @if (successMessage()) {
      <p class="success">{{ successMessage() }}</p>
    }
    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button mat-raised-button color="primary" type="submit">Create user</button>
  </form>
</div>
